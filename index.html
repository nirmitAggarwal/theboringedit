<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fefefe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0d0c" media="(prefers-color-scheme: dark)" />
    <title>The Boring Edit — a personal blog by Nirmit Aggarwal</title>
    <!--head-meta-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/rss+xml" title="The Boring Edit" href="/feed.xml" />
    <script>
      // Theme bootstrap — must run before any stylesheet paint.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical paint: paper color before the bundle loads */
      html { background: #fefefe; }
      html.dark { background: #0e0d0c; }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
