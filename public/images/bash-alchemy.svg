<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A scroll of raw text is poured through three cauldrons labeled sed, awk and sort, emerging as refined golden data">
  <defs>
    <pattern id="alchemy-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#alchemy-dots)"/>

  <!-- sparkles -->
  <path d="M330 220 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#7c3aed" opacity="0.85"/>
  <path d="M1060 260 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#7c3aed" opacity="0.6"/>
  <circle cx="980" cy="330" r="5" fill="#262626" opacity="0.35"/>

  <!-- raw text scroll -->
  <g transform="rotate(-10 200 340)">
    <rect x="140" y="300" width="130" height="88" rx="8" fill="#fefefe" stroke="#262626" stroke-width="4"/>
    <rect x="128" y="292" width="16" height="104" rx="8" fill="#262626"/>
    <rect x="266" y="292" width="16" height="104" rx="8" fill="#262626"/>
    <line x1="158" y1="324" x2="252" y2="324" stroke="#777777" stroke-width="3"/>
    <line x1="158" y1="344" x2="240" y2="344" stroke="#777777" stroke-width="3"/>
    <line x1="158" y1="364" x2="258" y2="364" stroke="#777777" stroke-width="3"/>
  </g>
  <text x="205" y="470" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">raw text dregs</text>

  <!-- flow into cauldron one -->
  <path d="M300 360 C 360 360, 380 420, 420 440" fill="none" stroke="#262626" stroke-width="4"/>
  <path d="M420 440 l-18 -4 l8 17 Z" fill="#262626"/>

  <!-- cauldron builder: pot at x with label -->
  <!-- pot 1: sed -->
  <path d="M420 470 A 80 72 0 0 0 580 470 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <line x1="404" y1="466" x2="596" y2="466" stroke="#262626" stroke-width="5"/>
  <line x1="452" y1="542" x2="440" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <line x1="548" y1="542" x2="560" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="468" cy="430" r="8" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="500" cy="406" r="11" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="532" cy="428" r="6" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="500" y="612" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7c3aed" text-anchor="middle">sed</text>

  <!-- flow to pot 2 -->
  <path d="M596 500 C 640 500, 640 500, 672 500" fill="none" stroke="#262626" stroke-width="4"/>
  <path d="M672 500 l-16 -9 l0 18 Z" fill="#262626"/>

  <!-- pot 2: awk -->
  <path d="M688 470 A 80 72 0 0 0 848 470 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <line x1="672" y1="466" x2="864" y2="466" stroke="#262626" stroke-width="5"/>
  <line x1="720" y1="542" x2="708" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <line x1="816" y1="542" x2="828" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <text x="768" y="612" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7c3aed" text-anchor="middle">awk</text>

  <!-- flow to pot 3 -->
  <path d="M864 500 C 908 500, 908 500, 940 500" fill="none" stroke="#262626" stroke-width="4"/>
  <path d="M940 500 l-16 -9 l0 18 Z" fill="#262626"/>

  <!-- pot 3: sort | uniq -->
  <path d="M956 470 A 80 72 0 0 0 1116 470 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <line x1="940" y1="466" x2="1132" y2="466" stroke="#262626" stroke-width="5"/>
  <line x1="988" y1="542" x2="976" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <line x1="1084" y1="542" x2="1096" y2="572" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <text x="1036" y="612" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">sort|uniq -c</text>

  <!-- refined data: falling gold -->
  <path d="M1100 546 C 1130 570, 1130 600, 1120 630" fill="none" stroke="#262626" stroke-width="4"/>
  <path d="M1120 630 l-14 -12 l18 -4 Z" fill="#262626"/>
  <circle cx="1080" cy="672" r="13" fill="#7c3aed"/>
  <circle cx="1042" cy="692" r="10" fill="#7c3aed" opacity="0.75"/>
  <circle cx="1108" cy="700" r="8" fill="#7c3aed" opacity="0.5"/>
  <path d="M1036 648 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" fill="#7c3aed"/>
  <text x="1036" y="744" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">✦ refined data</text>

  <!-- ground line -->
  <line x1="140" y1="768" x2="1060" y2="768" stroke="#d6d2cb" stroke-width="2"/>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 10 — THE ALCHEMY BENCH</text>
</svg>
