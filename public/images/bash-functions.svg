<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A spell factory machine: arguments pour in from a funnel, gears turn inside, output exits through a chute and an exit-code slot shows zero">
  <defs>
    <pattern id="fn-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#fn-dots)"/>

  <!-- machine body -->
  <rect x="380" y="300" width="440" height="280" rx="16" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <rect x="440" y="340" width="320" height="46" rx="6" fill="#262626"/>
  <text x="600" y="371" font-family="Menlo, Consolas, monospace" font-size="21" fill="#f8f5ef" text-anchor="middle">greet() {</text>

  <!-- gears -->
  <g stroke="#262626" stroke-width="4" fill="none">
    <circle cx="520" cy="480" r="36"/>
    <line x1="520" y1="436" x2="520" y2="452"/>
    <line x1="520" y1="508" x2="520" y2="524"/>
    <line x1="476" y1="480" x2="492" y2="480"/>
    <line x1="548" y1="480" x2="564" y2="480"/>
    <circle cx="620" cy="512" r="26"/>
    <line x1="620" y1="478" x2="620" y2="490"/>
    <line x1="620" y1="534" x2="620" y2="546"/>
    <line x1="586" y1="512" x2="598" y2="512"/>
    <line x1="642" y1="512" x2="654" y2="512"/>
  </g>
  <circle cx="520" cy="480" r="6" fill="#7c3aed"/>
  <circle cx="620" cy="512" r="5" fill="#7c3aed"/>

  <!-- args funnel -->
  <polygon points="290,214 430,214 386,300 334,300" fill="#f8f5ef" stroke="#262626" stroke-width="4"/>
  <line x1="334" y1="300" x2="380" y2="330" stroke="#262626" stroke-width="4"/>
  <text x="360" y="196" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">args: $1 $2 $3…</text>

  <!-- output chute -->
  <line x1="820" y1="400" x2="940" y2="400" stroke="#262626" stroke-width="4"/>
  <line x1="820" y1="424" x2="940" y2="424" stroke="#262626" stroke-width="4"/>
  <line x1="832" y1="412" x2="916" y2="412" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M940 412 l-16 -9 l0 18 Z" fill="#262626"/>
  <text x="920" y="380" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">stdout</text>

  <!-- exit-code slot -->
  <rect x="880" y="470" width="120" height="42" rx="6" fill="#fefefe" stroke="#7c3aed" stroke-width="3"/>
  <text x="940" y="498" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">$? = 0</text>
  <line x1="820" y1="500" x2="872" y2="492" stroke="#777777" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- sparkles -->
  <path d="M300 560 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" fill="#7c3aed" opacity="0.7"/>
  <circle cx="1050" cy="300" r="5" fill="#262626" opacity="0.35"/>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 09 — THE SPELL FACTORY</text>
</svg>
