<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Two hounds — grep sniffing a document and find circling a file tree — with a funnel labeled xargs feeding results to rm">
  <defs>
    <pattern id="hunters-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#hunters-dots)"/>

  <!-- sparkles -->
  <path d="M270 180 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#7c3aed" opacity="0.85"/>
  <path d="M950 160 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#262626" opacity="0.5"/>
  <circle cx="890" cy="240" r="5" fill="#262626" opacity="0.35"/>
  <circle cx="330" cy="130" r="4" fill="#262626" opacity="0.35"/>

  <!-- hound one: grep (silhouette over the document panel) -->
  <g fill="#262626">
    <rect x="176" y="188" width="92" height="38" rx="19"/>
    <circle cx="272" cy="184" r="17"/>
    <path d="M279 168 l9 -15 4 17 Z"/>
    <rect x="286" y="182" width="12" height="8" rx="3"/>
    <line x1="192" y1="226" x2="192" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <line x1="220" y1="226" x2="220" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <line x1="248" y1="226" x2="248" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <path d="M178 202 C 160 194, 152 178, 156 162" fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="240" y="286" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7c3aed" text-anchor="middle">grep</text>

  <!-- document panel with text lines, one highlighted -->
  <rect x="100" y="310" width="340" height="210" rx="10" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <rect x="128" y="340" width="200" height="10" rx="5" fill="#262626" opacity="0.18"/>
  <rect x="128" y="368" width="240" height="10" rx="5" fill="#262626" opacity="0.18"/>
  <rect x="122" y="394" width="296" height="26" rx="6" fill="#7c3aed" opacity="0.16"/>
  <rect x="128" y="400" width="160" height="12" rx="5" fill="#7c3aed"/>
  <text x="296" y="412" font-family="Menlo, Consolas, monospace" font-size="14" fill="#262626">todo: oil the armor</text>
  <rect x="128" y="432" width="180" height="10" rx="5" fill="#262626" opacity="0.18"/>
  <rect x="128" y="460" width="220" height="10" rx="5" fill="#262626" opacity="0.18"/>
  <rect x="128" y="488" width="120" height="10" rx="5" fill="#262626" opacity="0.18"/>
  <text x="270" y="556" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">grep -rn "todo" .</text>

  <!-- hound two: find (silhouette over the tree panel) -->
  <g fill="#262626">
    <rect x="856" y="188" width="92" height="38" rx="19"/>
    <circle cx="952" cy="184" r="17"/>
    <path d="M959 168 l9 -15 4 17 Z"/>
    <rect x="966" y="182" width="12" height="8" rx="3"/>
    <line x1="872" y1="226" x2="872" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <line x1="900" y1="226" x2="900" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <line x1="928" y1="226" x2="928" y2="252" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
    <path d="M858 202 C 840 194, 832 178, 836 162" fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="920" y="286" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7c3aed" text-anchor="middle">find</text>

  <!-- file tree panel with one circled node -->
  <rect x="760" y="310" width="340" height="210" rx="10" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="790" y="350" font-family="Menlo, Consolas, monospace" font-size="18" fill="#262626">~/projects</text>
  <text x="806" y="382" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777">├─ src/</text>
  <text x="806" y="410" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777">├─ notes.md</text>
  <ellipse cx="893" cy="436" rx="88" ry="18" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="806" y="441" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7c3aed">├─ build.log</text>
  <text x="806" y="472" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777">└─ data.csv</text>
  <text x="930" y="556" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">find . -name "*.log"</text>

  <!-- funnel: xargs feeding rm -->
  <path d="M500 600 L700 600 L630 668 L630 700 L570 700 L570 668 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="600" y="640" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">xargs</text>
  <rect x="640" y="556" width="16" height="16" fill="#262626" opacity="0.6"/>
  <rect x="548" y="548" width="14" height="14" fill="#7c3aed" opacity="0.7"/>
  <rect x="596" y="528" width="12" height="12" fill="#262626" opacity="0.4"/>
  <text x="600" y="740" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">| rm   (one file per lap)</text>

  <!-- ground line -->
  <line x1="200" y1="768" x2="1000" y2="768" stroke="#d6d2cb" stroke-width="2"/>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 04 — THE HUNTERS</text>
</svg>
