<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Two bash commands connected by a literal pipe, with stdout flowing into a file and stderr dashed away to a second bucket">
  <defs>
    <pattern id="pipes-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#pipes-dots)"/>

  <!-- pipe chain: cat | grep | wc -->
  <rect x="100" y="330" width="240" height="110" rx="10" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="220" y="394" font-family="Menlo, Consolas, monospace" font-size="21" fill="#262626" text-anchor="middle">cat poem.txt</text>

  <rect x="520" y="330" width="240" height="110" rx="10" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="640" y="394" font-family="Menlo, Consolas, monospace" font-size="21" fill="#262626" text-anchor="middle">grep love</text>

  <rect x="940" y="330" width="180" height="110" rx="10" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="1030" y="394" font-family="Menlo, Consolas, monospace" font-size="21" fill="#262626" text-anchor="middle">wc -l</text>

  <!-- pipe segment one -->
  <line x1="340" y1="372" x2="520" y2="372" stroke="#262626" stroke-width="4"/>
  <line x1="340" y1="398" x2="520" y2="398" stroke="#262626" stroke-width="4"/>
  <rect x="336" y="360" width="12" height="50" fill="#262626"/>
  <rect x="512" y="360" width="12" height="50" fill="#262626"/>
  <line x1="356" y1="385" x2="492" y2="385" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M492 385 l-16 -9 l0 18 Z" fill="#7c3aed"/>

  <!-- pipe segment two -->
  <line x1="760" y1="372" x2="940" y2="372" stroke="#262626" stroke-width="4"/>
  <line x1="760" y1="398" x2="940" y2="398" stroke="#262626" stroke-width="4"/>
  <rect x="756" y="360" width="12" height="50" fill="#262626"/>
  <rect x="932" y="360" width="12" height="50" fill="#262626"/>
  <line x1="776" y1="385" x2="912" y2="385" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M912 385 l-16 -9 l0 18 Z" fill="#7c3aed"/>

  <!-- branch: stdout vs stderr -->
  <line x1="640" y1="440" x2="640" y2="500" stroke="#262626" stroke-width="3"/>
  <line x1="640" y1="500" x2="470" y2="500" stroke="#7c3aed" stroke-width="4"/>
  <path d="M470 500 l-16 -9 l0 18 Z" fill="#7c3aed"/>
  <line x1="640" y1="500" x2="810" y2="500" stroke="#777777" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M810 500 l-16 -9 l0 18 Z" fill="#777777"/>

  <!-- buckets -->
  <path d="M392 540 L508 540 L494 640 L406 640 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <path d="M400 528 a24 24 0 0 1 100 0" fill="none" stroke="#262626" stroke-width="4"/>
  <text x="450" y="668" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c3aed" text-anchor="middle">&gt; out.txt</text>

  <path d="M752 540 L868 540 L854 640 L766 640 Z" fill="#f8f5ef" stroke="#777777" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M760 528 a24 24 0 0 1 100 0" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="810" y="668" font-family="Menlo, Consolas, monospace" font-size="19" fill="#777777" text-anchor="middle">2&gt; err.txt</text>

  <!-- stream labels -->
  <text x="470" y="486" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7c3aed" text-anchor="middle">stdout</text>
  <text x="810" y="486" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">stderr</text>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 05 — PIPES &amp; PLUMBING</text>
</svg>
