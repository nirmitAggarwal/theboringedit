<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A quest board with six pinned project cards: renamer, backup, monitor, scaffold, cleanup and quiz scripts">
  <defs>
    <pattern id="quest-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#quest-dots)"/>

  <!-- board -->
  <rect x="190" y="212" width="820" height="480" rx="12" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <rect x="206" y="228" width="788" height="448" rx="8" fill="none" stroke="#d6d2cb" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="600" y="286" font-family="Menlo, Consolas, monospace" font-size="23" fill="#7c3aed" text-anchor="middle" letter-spacing="4">pick your quest</text>

  <!-- row 1 -->
  <g transform="rotate(-2 360 395)">
    <rect x="250" y="325" width="220" height="140" rx="6" fill="#f8f5ef" stroke="#262626" stroke-width="3"/>
    <circle cx="360" cy="325" r="8" fill="#7c3aed"/>
    <text x="360" y="382" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">renamer.sh</text>
    <text x="360" y="416" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">bulk-rename files</text>
  </g>
  <g transform="rotate(2 610 395)">
    <rect x="500" y="325" width="220" height="140" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="610" cy="325" r="8" fill="#262626"/>
    <text x="610" y="382" font-family="Menlo, Consolas, monospace" font-size="20" fill="#f8f5ef" text-anchor="middle" font-weight="bold">backup.sh</text>
    <text x="610" y="416" font-family="Menlo, Consolas, monospace" font-size="15" fill="#ede9fe" text-anchor="middle">tar + rotate, nightly</text>
  </g>
  <g transform="rotate(-2 860 395)">
    <rect x="750" y="325" width="220" height="140" rx="6" fill="#f8f5ef" stroke="#262626" stroke-width="3"/>
    <circle cx="860" cy="325" r="8" fill="#7c3aed"/>
    <text x="860" y="382" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">monitor.sh</text>
    <text x="860" y="416" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">curl your sites hourly</text>
  </g>

  <!-- row 2 -->
  <g transform="rotate(2 360 575)">
    <rect x="250" y="505" width="220" height="140" rx="6" fill="#f8f5ef" stroke="#262626" stroke-width="3"/>
    <circle cx="360" cy="505" r="8" fill="#7c3aed"/>
    <text x="360" y="562" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">scaffold.sh</text>
    <text x="360" y="596" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">new project in 1s</text>
  </g>
  <g transform="rotate(-2 610 575)">
    <rect x="500" y="505" width="220" height="140" rx="6" fill="#f8f5ef" stroke="#262626" stroke-width="3"/>
    <circle cx="610" cy="505" r="8" fill="#7c3aed"/>
    <text x="610" y="562" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">cleanup.sh</text>
    <text x="610" y="596" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">hunt the disk hogs</text>
  </g>
  <g transform="rotate(2 860 575)">
    <rect x="750" y="505" width="220" height="140" rx="6" fill="#f8f5ef" stroke="#262626" stroke-width="3"/>
    <circle cx="860" cy="505" r="8" fill="#7c3aed"/>
    <text x="860" y="562" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle" font-weight="bold">quiz.sh</text>
    <text x="860" y="596" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">terminal trivia night</text>
  </g>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 15 — THE QUEST BOARD</text>
</svg>
