<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A map of four roads leaving a home tower: ssh to a distant server, cron circling a clock, a git hook guarding a gate, and a CI conveyor leading to a cloud">
  <defs>
    <pattern id="realm-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#realm-dots)"/>

  <!-- sparkles -->
  <path d="M270 190 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#7c3aed" opacity="0.85"/>
  <path d="M1020 170 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#262626" opacity="0.5"/>
  <circle cx="620" cy="150" r="4" fill="#262626" opacity="0.35"/>

  <!-- home tower -->
  <rect x="120" y="420" width="90" height="180" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <polygon points="110,420 220,420 165,340" fill="#262626"/>
  <rect x="152" y="540" width="26" height="60" fill="#262626"/>
  <text x="165" y="650" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">laptop</text>

  <!-- road one: ssh to distant server -->
  <path d="M220 470 C 340 440, 360 300, 470 280" fill="none" stroke="#262626" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="330" y="352" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7c3aed">ssh</text>

  <!-- distant server -->
  <rect x="475" y="200" width="150" height="150" rx="8" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <line x1="475" y1="240" x2="625" y2="240" stroke="#262626" stroke-width="3"/>
  <line x1="475" y1="280" x2="625" y2="280" stroke="#262626" stroke-width="3"/>
  <circle cx="500" cy="222" r="6" fill="#7c3aed"/>
  <circle cx="500" cy="262" r="6" fill="#262626" opacity="0.35"/>
  <circle cx="500" cy="302" r="6" fill="#262626" opacity="0.35"/>
  <text x="550" y="382" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">the datacentre</text>

  <!-- road two: cron circle around clock -->
  <path d="M210 520 C 330 540, 380 620, 470 630" fill="none" stroke="#262626" stroke-width="4"/>
  <circle cx="545" cy="628" r="58" fill="none" stroke="#262626" stroke-width="4" stroke-dasharray="6 8"/>
  <circle cx="545" cy="628" r="44" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <line x1="545" y1="628" x2="545" y2="600" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <line x1="545" y1="628" x2="565" y2="636" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <text x="545" y="730" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">cron: 30 2 * * *</text>

  <!-- road three: git gate -->
  <path d="M220 560 C 320 600, 700 600, 800 580" fill="none" stroke="#262626" stroke-width="4"/>
  <rect x="800" y="540" width="24" height="80" fill="#262626"/>
  <rect x="880" y="540" width="24" height="80" fill="#262626"/>
  <path d="M800 540 C 830 516, 874 516, 904 540" fill="none" stroke="#262626" stroke-width="4"/>
  <text x="862" y="528" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7c3aed" text-anchor="middle">pre-commit</text>
  <text x="862" y="652" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">git hooks: the gate</text>

  <!-- road four: ci conveyor to cloud -->
  <path d="M625 275 C 740 260, 800 240, 880 235" fill="none" stroke="#262626" stroke-width="4"/>
  <text x="740" y="240" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7c3aed">ci</text>
  <path d="M940 235 C 940 190, 1000 180, 1010 210 C 1050 190, 1090 230, 1060 250 C 1080 280, 1020 300, 1000 280 C 980 300, 930 285, 940 235 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="1005" y="252" font-family="Menlo, Consolas, monospace" font-size="16" fill="#262626" text-anchor="middle">the cloud</text>
  <text x="1005" y="330" font-family="Menlo, Consolas, monospace" font-size="17" fill="#777777" text-anchor="middle">bash in a JSON envelope</text>

  <!-- compass rose -->
  <g transform="translate(1075 620)">
    <circle r="30" fill="none" stroke="#262626" stroke-width="3"/>
    <polygon points="0,-24 6,0 0,24 -6,0" fill="#7c3aed"/>
    <text y="-40" font-family="Menlo, Consolas, monospace" font-size="15" fill="#777777" text-anchor="middle">N</text>
  </g>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 14 — THE WIDER REALM</text>
</svg>
