<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A triptych: a shield engraved set -euo pipefail, a broom labeled trap sweeping temp files, and a seeing-eye stone labeled bash -x showing a trace line">
  <defs>
    <pattern id="ward-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#ward-dots)"/>

  <!-- sparkles -->
  <path d="M300 180 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#7c3aed" opacity="0.85"/>
  <path d="M640 160 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#262626" opacity="0.5"/>
  <path d="M1000 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" fill="#7c3aed" opacity="0.6"/>

  <!-- panel one: the shield -->
  <path d="M240 260 l80 -28 80 28 v90 c0 66 -40 108 -80 130 c-40 -22 -80 -64 -80 -130 Z" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <text x="320" y="352" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle">set -e</text>
  <text x="320" y="384" font-family="Menlo, Consolas, monospace" font-size="20" fill="#262626" text-anchor="middle">-u</text>
  <text x="320" y="416" font-family="Menlo, Consolas, monospace" font-size="20" fill="#7c3aed" text-anchor="middle">-o pipefail</text>
  <text x="320" y="540" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">the ward</text>

  <!-- panel two: the broom -->
  <line x1="600" y1="250" x2="668" y2="440" stroke="#262626" stroke-width="6" stroke-linecap="round"/>
  <polygon points="640,436 700,436 688,510 652,510" fill="#7c3aed" opacity="0.85"/>
  <line x1="646" y1="452" x2="690" y2="452" stroke="#f8f5ef" stroke-width="3"/>
  <line x1="650" y1="472" x2="688" y2="472" stroke="#f8f5ef" stroke-width="3"/>
  <line x1="654" y1="492" x2="686" y2="492" stroke="#f8f5ef" stroke-width="3"/>
  <rect x="740" y="470" width="18" height="18" fill="#262626" opacity="0.55"/>
  <rect x="786" y="484" width="14" height="14" fill="#262626" opacity="0.35"/>
  <rect x="822" y="494" width="10" height="10" fill="#262626" opacity="0.2"/>
  <line x1="736" y1="462" x2="724" y2="474" stroke="#777777" stroke-width="2"/>
  <line x1="782" y1="476" x2="770" y2="488" stroke="#777777" stroke-width="2"/>
  <text x="680" y="580" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">trap 'rm -rf $tmp' EXIT</text>

  <!-- panel three: the seeing-eye stone -->
  <circle cx="1000" cy="350" r="76" fill="#fefefe" stroke="#262626" stroke-width="4"/>
  <circle cx="1000" cy="350" r="34" fill="#7c3aed" opacity="0.85"/>
  <circle cx="1000" cy="350" r="14" fill="#262626"/>
  <line x1="1000" y1="244" x2="1000" y2="222" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <line x1="1000" y1="456" x2="1000" y2="478" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <line x1="894" y1="350" x2="872" y2="350" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <line x1="1106" y1="350" x2="1128" y2="350" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <rect x="880" y="490" width="240" height="46" rx="8" fill="#262626"/>
  <text x="1000" y="519" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7c3aed" text-anchor="middle">+ cd /nonexistent</text>
  <text x="1000" y="580" font-family="Menlo, Consolas, monospace" font-size="18" fill="#777777" text-anchor="middle">bash -x, the seeing-eye stone</text>

  <!-- ground line -->
  <line x1="200" y1="640" x2="1000" y2="640" stroke="#d6d2cb" stroke-width="2"/>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 11 — THE WARD</text>
</svg>
