<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A bookshelf holding resources, one book glowing orange">
  <defs>
    <pattern id="shelf-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#262626" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f8f5ef"/>
  <rect width="1200" height="800" fill="url(#shelf-dots)"/>

  <!-- shelf frame -->
  <rect x="160" y="200" width="880" height="470" fill="none" stroke="#262626" stroke-width="6"/>
  <line x1="160" y1="435" x2="1040" y2="435" stroke="#262626" stroke-width="6"/>

  <!-- top row of books -->
  <rect x="220" y="256" width="54" height="176" fill="#262626"/>
  <rect x="284" y="276" width="46" height="156" fill="#262626" opacity="0.75"/>
  <rect x="340" y="246" width="60" height="186" fill="#262626" opacity="0.55"/>
  <rect x="412" y="286" width="44" height="146" fill="#fd4d25"/>
  <rect x="466" y="266" width="52" height="166" fill="#262626" opacity="0.65"/>
  <rect x="530" y="292" width="40" height="140" fill="#262626" opacity="0.8"/>

  <!-- leaning book -->
  <rect x="596" y="272" width="48" height="160" fill="#262626" opacity="0.7" transform="rotate(9 596 432)"/>

  <!-- bottom row: stacked notebooks -->
  <rect x="220" y="490" width="200" height="34" fill="#262626" opacity="0.8"/>
  <rect x="228" y="456" width="184" height="30" fill="#262626" opacity="0.55"/>
  <rect x="236" y="428" width="168" height="24" fill="#262626" opacity="0.7"/>

  <!-- a plant on the shelf -->
  <path d="M960 435 v-60" stroke="#262626" stroke-width="5"/>
  <path d="M960 395 q-34 -12 -38 -44 q36 4 38 44 Z" fill="#262626" opacity="0.75"/>
  <path d="M960 405 q34 -16 36 -52 q-38 8 -36 52 Z" fill="#262626" opacity="0.55"/>
  <rect x="936" y="435" width="48" height="0" fill="none"/>

  <!-- the one loud book, bottom right -->
  <rect x="820" y="470" width="58" height="196" fill="#fd4d25"/>
  <line x1="838" y1="470" x2="838" y2="666" stroke="#fefefe" stroke-width="4"/>
  <circle cx="1020" cy="560" r="26" fill="none" stroke="#262626" stroke-width="3"/>

  <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#777777">FIG. 04 — THE SHELF</text>
</svg>
